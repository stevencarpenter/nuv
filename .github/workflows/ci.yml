name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run --frozen ruff check src/ tests/
          uv run --frozen ruff format --check src/ tests/

      - name: Type check
        run: uv run --frozen ty check src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run --frozen pytest

      - name: Integration smoke test (script)
        if: matrix.python-version == '3.14'
        run: |
          uv run --frozen nuv new smoke-test --at /tmp/smoke-test
          cd /tmp/smoke-test && uv sync --frozen && uv run --frozen pytest

      - name: Set up Java (required by PySpark)
        if: matrix.python-version == '3.14'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Integration smoke test (spark)
        if: matrix.python-version == '3.14'
        run: |
          uv run --frozen nuv new spark-smoke --at /tmp/spark-smoke --archetype spark --python-version 3.13
          cd /tmp/spark-smoke && uv sync --frozen && uv run --frozen pytest

      - name: Integration smoke test (fastapi)
        if: matrix.python-version == '3.14'
        run: |
          uv run --frozen nuv new api-smoke --at /tmp/api-smoke --archetype fastapi
          cd /tmp/api-smoke && uv sync --frozen && uv run --frozen pytest

      - name: Integration smoke test (ds)
        if: matrix.python-version == '3.14'
        run: |
          uv run --frozen nuv new ds-smoke --at /tmp/ds-smoke --archetype ds
          cd /tmp/ds-smoke && uv sync --frozen && uv run --frozen pytest && uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen ty check

      - name: Integration smoke test (polars)
        if: matrix.python-version == '3.14'
        run: |
          uv run --frozen nuv new polars-smoke --at /tmp/polars-smoke --archetype polars
          cd /tmp/polars-smoke && uv sync --frozen && uv run --frozen pytest && uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen ty check

      - name: Build wheel for distribution smoke tests
        if: matrix.python-version == '3.14'
        run: uv build

      - name: Tool install smoke test from wheel
        if: matrix.python-version == '3.14'
        run: |
          uv tool install --force-reinstall dist/*.whl
          nuv --help

      - name: uvx smoke test from wheel
        if: matrix.python-version == '3.14'
        run: uvx --from dist/*.whl nuv --help
